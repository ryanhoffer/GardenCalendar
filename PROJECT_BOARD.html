<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Garden Calendar — Project Board (local only)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { cursor: grab; }
    .card:active { cursor: grabbing; }
    .card.dragging { opacity: .45; }
    .col-drop.drag-over { background: #eef2ff; outline: 2px dashed #a5b4fc; outline-offset: -6px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-[1400px] mx-auto px-5 py-3 flex items-center gap-3 flex-wrap">
      <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold">✓</div>
      <div>
        <h1 class="font-bold leading-tight">Project Board</h1>
        <p class="text-[11px] text-slate-500">Garden Calendar · synced to Supabase (admin only)</p>
      </div>
      <div class="ml-auto flex items-center gap-2 text-sm">
        <span id="dataStatus" class="text-[11px] font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-500">—</span>
        <span id="stats" class="text-xs text-slate-500 mr-1"></span>
        <button id="addBtn" class="px-3 py-1.5 rounded-lg font-semibold bg-slate-900 text-white hover:bg-slate-800 transition hidden">+ Add task</button>
        <button id="refreshBtn" class="px-3 py-1.5 rounded-lg font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition hidden">Refresh</button>
        <button id="signOutBtn" class="px-3 py-1.5 rounded-lg font-semibold bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700 transition hidden">Sign out</button>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-5 py-6">
    <!-- Sign-in gate (admin only) -->
    <div id="gate" class="hidden max-w-sm mx-auto mt-10 bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <h2 class="font-bold text-lg mb-1">Sign in</h2>
      <p class="text-xs text-slate-500 mb-4">Admin accounts only. The board is stored in Supabase and synced across your devices.</p>
      <label class="block text-[11px] font-semibold text-slate-500 mb-1">Email</label>
      <input id="gEmail" type="email" placeholder="you@example.com"
        class="w-full mb-2 px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none focus:border-slate-400" />
      <label class="block text-[11px] font-semibold text-slate-500 mb-1">Password</label>
      <input id="gPassword" type="password" placeholder="••••••••"
        class="w-full mb-3 px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none focus:border-slate-400" />
      <button id="gSignIn" class="w-full px-4 py-2 rounded-lg text-sm font-semibold bg-slate-900 text-white hover:bg-slate-800 transition">Sign in</button>
      <p id="gMsg" class="text-xs text-rose-600 mt-2 hidden"></p>
    </div>

    <div id="board" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></div>
  </main>

  <!-- Editor modal -->
  <div id="modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4">
    <div id="modalOverlay" class="absolute inset-0 bg-slate-900/40"></div>
    <div class="relative w-full max-w-lg bg-white rounded-2xl border border-slate-200 shadow-xl p-5">
      <h2 id="modalTitle" class="font-bold text-lg mb-4">Add task</h2>
      <label class="block text-[11px] font-semibold text-slate-500 mb-1">Title</label>
      <input id="fTitle" type="text" placeholder="Short summary"
        class="w-full mb-3 px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none focus:border-slate-400" />
      <label class="block text-[11px] font-semibold text-slate-500 mb-1">Notes</label>
      <textarea id="fNotes" rows="3" placeholder="Details, acceptance criteria, links…"
        class="w-full mb-3 px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none focus:border-slate-400"></textarea>
      <div class="flex gap-3 mb-4">
        <div class="flex-1">
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Priority</label>
          <select id="fPriority" class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none">
            <option value="P0">P0 — blocker</option>
            <option value="P1">P1 — high</option>
            <option value="P2" selected>P2 — normal</option>
            <option value="P3">P3 — nice to have</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Tag</label>
          <input id="fTag" type="text" placeholder="auth, billing, ui…"
            class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none focus:border-slate-400" />
        </div>
        <div class="flex-1">
          <label class="block text-[11px] font-semibold text-slate-500 mb-1">Column</label>
          <select id="fColumn" class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 bg-slate-50 outline-none"></select>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="fSave" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-900 text-white hover:bg-slate-800 transition">Save</button>
        <button id="fCancel" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Cancel</button>
        <button id="fDelete" class="ml-auto px-4 py-2 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 hover:bg-rose-100 hover:text-rose-700 transition hidden">Delete</button>
      </div>
    </div>
  </div>

  <!-- (data is synced to Supabase; no file import needed) -->

  <script>
    // Public Supabase config (anon key is safe to expose; RLS restricts the
    // project_board table to admins only). Same project as the main app.
    const SUPABASE_URL = 'https://zclmkmgakwwsofydzbxa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjbG1rbWdha3d3c29meWR6YnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzA3ODksImV4cCI6MjEwMjIwNjc4OX0.9L6Qw42L8do49fv81Hb-dM4ikf1G460LWe04w_TVz7U';
    const TABLE = 'project_board';
    const COLUMNS = [
      { id: 'backlog', title: 'Backlog',     accent: 'bg-slate-400' },
      { id: 'todo',    title: 'To do',        accent: 'bg-sky-500' },
      { id: 'doing',   title: 'In progress',  accent: 'bg-amber-500' },
      { id: 'done',    title: 'Done',         accent: 'bg-emerald-500' },
    ];
    const PRIORITY_STYLE = {
      P0: 'bg-rose-100 text-rose-700',
      P1: 'bg-amber-100 text-amber-700',
      P2: 'bg-sky-100 text-sky-700',
      P3: 'bg-slate-100 text-slate-500',
    };

    // ---- State ----
    let sb = null;          // Supabase client
    let session = null;     // auth session
    let cards = [];         // { id, title, notes, priority, tag, column, position }
    let editingId = null;

    function uid() { return 'c' + Math.random().toString(36).slice(2, 9); }
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    // Map a DB row (column_id) to the in-memory card shape (column).
    function fromRow(r) {
      return { id: r.id, title: r.title, notes: r.notes || '', priority: r.priority || 'P2',
               tag: r.tag || '', column: r.column_id || 'todo', position: r.position || 0 };
    }
    // Map a card to a DB row for upsert.
    function toRow(c) {
      return { id: c.id, title: c.title, notes: c.notes || '', priority: c.priority || 'P2',
               tag: c.tag || '', column_id: c.column || 'todo', position: c.position || 0 };
    }

    function setStatus(text, tone) {
      const el = $('dataStatus');
      if (!el) return;
      const tones = {
        ok: 'bg-emerald-100 text-emerald-700', busy: 'bg-sky-100 text-sky-700',
        err: 'bg-rose-100 text-rose-700', idle: 'bg-slate-100 text-slate-500',
      };
      el.textContent = text;
      el.className = 'text-[11px] font-semibold px-2 py-1 rounded-full ' + (tones[tone] || tones.idle);
    }

    // ---- Data (Supabase) ----
    async function loadCards() {
      setStatus('Loading…', 'busy');
      const { data, error } = await sb.from(TABLE).select('*')
        .order('column_id', { ascending: true })
        .order('position', { ascending: true });
      if (error) { setStatus('Load error', 'err'); console.warn(error); return; }
      cards = (data || []).map(fromRow);
      setStatus('✓ Synced', 'ok');
      render();
    }

    // Upsert one card. Optimistic: caller has already mutated `cards`.
    async function upsertCard(c) {
      setStatus('Saving…', 'busy');
      const { error } = await sb.from(TABLE).upsert(toRow(c));
      if (error) { setStatus('Save error', 'err'); console.warn(error); return false; }
      setStatus('✓ Synced', 'ok');
      return true;
    }

    async function deleteRow(id) {
      setStatus('Saving…', 'busy');
      const { error } = await sb.from(TABLE).delete().eq('id', id);
      if (error) { setStatus('Delete error', 'err'); console.warn(error); return false; }
      setStatus('✓ Synced', 'ok');
      return true;
    }

    // ---- Render ----
    function render() {
      const board = $('board');
      board.innerHTML = COLUMNS.map(col => {
        const items = cards.filter(c => c.column === col.id);
        return (
          '<section class="bg-slate-50/60 rounded-2xl border border-slate-200 flex flex-col min-h-[200px]">' +
            '<div class="flex items-center gap-2 px-4 py-3 border-b border-slate-200">' +
              '<span class="w-2.5 h-2.5 rounded-full ' + col.accent + '"></span>' +
              '<h2 class="font-bold text-sm">' + col.title + '</h2>' +
              '<span class="ml-auto text-xs font-bold text-slate-400">' + items.length + '</span>' +
            '</div>' +
            '<div class="col-drop flex-1 p-3 space-y-2.5" data-col="' + col.id + '">' +
              items.map(cardHtml).join('') +
            '</div>' +
          '</section>'
        );
      }).join('');
      wireDnd();
      renderStats();
    }

    function cardHtml(c) {
      const pr = PRIORITY_STYLE[c.priority] || PRIORITY_STYLE.P2;
      const done = c.column === 'done';
      return (
        '<article class="card bg-white rounded-xl border border-slate-200 shadow-sm p-3" draggable="true" data-id="' + c.id + '">' +
          '<div class="flex items-start gap-2">' +
            '<p class="text-sm font-semibold leading-snug flex-1 ' + (done ? 'line-through text-slate-400' : 'text-slate-800') + '">' + esc(c.title) + '</p>' +
          '</div>' +
          (c.notes ? '<p class="text-[11px] text-slate-500 mt-1 leading-snug line-clamp-3">' + esc(c.notes) + '</p>' : '') +
          '<div class="flex items-center gap-1.5 mt-2">' +
            '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ' + pr + '">' + esc(c.priority) + '</span>' +
            (c.tag ? '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">' + esc(c.tag) + '</span>' : '') +
            '<button class="edit-btn ml-auto text-[11px] font-semibold text-slate-400 hover:text-slate-700" data-id="' + c.id + '">Edit</button>' +
          '</div>' +
        '</article>'
      );
    }

    function renderStats() {
      const total = cards.length;
      const done = cards.filter(c => c.column === 'done').length;
      const open = total - done;
      const p0 = cards.filter(c => c.priority === 'P0' && c.column !== 'done').length;
      $('stats').textContent = open + ' open · ' + done + ' done' + (p0 ? ' · ' + p0 + ' P0' : '');
    }

    // ---- Drag & drop ----
    function wireDnd() {
      document.querySelectorAll('.card').forEach(el => {
        el.addEventListener('dragstart', e => {
          el.classList.add('dragging');
          e.dataTransfer.setData('text/plain', el.dataset.id);
          e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragend', () => el.classList.remove('dragging'));
      });
      document.querySelectorAll('.col-drop').forEach(drop => {
        drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
        drop.addEventListener('drop', e => {
          e.preventDefault();
          drop.classList.remove('drag-over');
          const id = e.dataTransfer.getData('text/plain');
          const card = cards.find(c => c.id === id);
          if (!card) return;
          card.column = drop.dataset.col;
          // Position at the end of the target column.
          const inCol = cards.filter(c => c.column === card.column && c.id !== id);
          card.position = inCol.length ? Math.max(...inCol.map(c => c.position || 0)) + 1 : 0;
          cards = cards.filter(c => c.id !== id).concat(card);
          render();
          upsertCard(card);
        });
      });
      document.querySelectorAll('.edit-btn').forEach(b =>
        b.addEventListener('click', e => { e.stopPropagation(); openModal(b.dataset.id); }));
      document.querySelectorAll('.card').forEach(el =>
        el.addEventListener('dblclick', () => openModal(el.dataset.id)));
    }

    // ---- Modal ----
    function fillColumnSelect() {
      $('fColumn').innerHTML = COLUMNS.map(c => '<option value="' + c.id + '">' + c.title + '</option>').join('');
    }
    function openModal(id) {
      editingId = id || null;
      const c = id ? cards.find(x => x.id === id) : null;
      $('modalTitle').textContent = c ? 'Edit task' : 'Add task';
      $('fTitle').value = c ? c.title : '';
      $('fNotes').value = c ? c.notes : '';
      $('fPriority').value = c ? c.priority : 'P2';
      $('fTag').value = c ? (c.tag || '') : '';
      $('fColumn').value = c ? c.column : 'todo';
      $('fDelete').classList.toggle('hidden', !c);
      $('modal').classList.remove('hidden');
      setTimeout(() => $('fTitle').focus(), 20);
    }
    function closeModal() { $('modal').classList.add('hidden'); editingId = null; }
    async function saveModal() {
      const title = $('fTitle').value.trim();
      if (!title) { $('fTitle').focus(); return; }
      const data = {
        title,
        notes: $('fNotes').value.trim(),
        priority: $('fPriority').value,
        tag: $('fTag').value.trim(),
        column: $('fColumn').value,
      };
      let card;
      if (editingId) {
        card = cards.find(x => x.id === editingId);
        if (card) Object.assign(card, data);
      } else {
        const inCol = cards.filter(c => c.column === data.column);
        card = Object.assign({ id: uid(), position: inCol.length }, data);
        cards.push(card);
      }
      render();
      closeModal();
      if (card) await upsertCard(card);
    }
    async function deleteCard() {
      if (!editingId) return;
      if (!confirm('Delete this task?')) return;
      const id = editingId;
      cards = cards.filter(c => c.id !== id);
      render();
      closeModal();
      await deleteRow(id);
    }

    // ---- Save to file / import / reload ----
    // ---- Auth ----
    function showGate(on) {
      $('gate').classList.toggle('hidden', !on);
      $('board').classList.toggle('hidden', on);
      ['addBtn', 'refreshBtn', 'signOutBtn'].forEach(id => $(id).classList.toggle('hidden', on));
    }
    async function signIn() {
      const email = $('gEmail').value.trim();
      const password = $('gPassword').value;
      const msg = $('gMsg'); msg.classList.add('hidden');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { msg.textContent = error.message; msg.classList.remove('hidden'); return; }
      await enter();
    }
    async function enter() {
      const { data: { session: s } } = await sb.auth.getSession();
      session = s;
      if (!session) { showGate(true); return; }
      // Verify admin by attempting a read; RLS blocks non-admins (returns []).
      showGate(false);
      await loadCards();
    }

    // ---- Wire ----
    function wire() {
      fillColumnSelect();
      $('addBtn').addEventListener('click', () => openModal(null));
      $('fSave').addEventListener('click', saveModal);
      $('fCancel').addEventListener('click', closeModal);
      $('fDelete').addEventListener('click', deleteCard);
      $('modalOverlay').addEventListener('click', closeModal);
      $('refreshBtn').addEventListener('click', loadCards);
      $('gSignIn').addEventListener('click', signIn);
      $('gPassword').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
      $('signOutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
        if ((e.key === 'n' || e.key === 'N') && $('modal').classList.contains('hidden') &&
            document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault(); openModal(null);
        }
      });
    }

    (async function init() {
      wire();
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await enter();
    })();
  </script>
</body>
</html>
